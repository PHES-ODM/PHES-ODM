  setTypeSet:
    description: The mmaSet for defining the possible values of setType. Previously
      undefined but now made explicit in this set.
    title: Set Type Set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      specimenSets:
        description: Sets of specimens.  Specimen sets are used when a measure or
          attribute can be recorded for more than one specimen.
        title: Specimen sets
      qualityIndSets:
        description: Sets of quality indicators or measures. For example, PCR have
          a quality measure set.
        title: Quality indicator sets
      compartmentSets:
        description: Sets of compartments. Compartment sets are used to identify when
          a measure can be recorded for more than one compartment. For example, SARS-CoV-2
          can be measured in people (humans), water, surface, or air.
        title: Compartment sets
      aggregationSets:
        description: Sets of aggregations. Examples of aggregation sets include logarithm,
          linear and boolean.
        title: Aggregation sets
      mmaSets:
        description: A set of categories. For example, site type has a list of different
          sites, such as a wastewater treatment plant, a septic tank, or a pumping
          station. Only used for the dictionary entries of parts.
        title: Measure, method, or attribute sets
      unitSets:
        description: Sets of units. Contains units that are associated with part types
          such as measures. Sets are lists of input values. Each input value within
          a set is a part (has a partID) that can be reused between sets. For example,
          a set A could contain the values of 'yes' and 'no'; and set B could contain
          the values of 'yes', 'no', and 'maybe.' partTypes with sets include aggregations,
          compartments, missingness, quality flags, specimens, and units. Measures
          with categories and dataTypes have their own specific sets (catSetID) because
          their input values are unique and are not reused.
        title: Unit sets
      shortSets:
        description: Sets used to group together short names for tables or part types
          in ODM.
        title: Shorthand or Short Name Set Type
      missingnessSets:
        description: Set of missingness values. Examples of missingness sets may include
          NR or NA esclusive sets, or general all-purpose sets.
        title: Missingness sets
      dictSets:
        description: Sets used to describe and group dictionary tables.
        title: Dictionary set type
