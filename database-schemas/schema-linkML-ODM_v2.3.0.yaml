  tables:
    description: Tables are where measures, methods and attributes are recorded. Tables
      represent the main entities of the environmental surveillance. An example of
      a  table is `site` a collection of attributes such as site name and address
      to describe where environment samples are taken. PHES-ODM has report tables,
      but users can create their own tables as well.
    title: Tables
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      addresses:
        description: The table that contains information about addresses. Addresses
          can recorded for sites, organizations or contacts (indivduals). The Sites,
          Organizations, and Contacts tables include a link to the addresses table
          through Address ID. The short name for the table (partID) can be found in
          the instructions field.
        title: Address table
      contacts:
        description: The table that contains information about a contact; a person
          who is the contact of a site or laboratory. The short name for the table
          (partID) can be found in the instructions field.
        title: Contact table
      countries:
        description: Look up table for the possible country inputs. The short name
          for the table (partID) can be found in the instructions field.
        title: Countries look-up tables
      datasets:
        description: A report table for capturing details about data's parental data
          set and data custodians. Supplying attribution for data collectors. The
          short name for the table (partID) can be found in the instructions field.
        title: Dataset table
      instruments:
        description: The table that contains information about instruments. The short
          name for the table (partID) can be found in the instructions field.
        title: Instrument table
      languages:
        description: Look up table for all languages, used to give structure to the
          translation table. The short name for the table (partID) can be found in
          the instructions field.
        title: Language Look-up table
      measures:
        description: The table that contains information and details about a given
          measure. The short name for the table (partID) can be found in the instructions
          field.
        title: Measure report table
      measureSets:
        description: The table that identifies sets of measures. Examples of measure
          sets include a set of replicates, dilutions (used to generate a Ct curve)
          or varients that are identified in a single sample. The short name for the
          table (partID) can be found in the instructions field.
        title: Measure set report table
      organizations:
        description: The table that contains information about a laboratory. The short
          name for the table (partID) can be found in the instructions field.
        title: Organization table
      parts:
        description: Look up table containing all parts in of the data model. Contains
          all parts, including self-referential parts. The short name for the table
          (partID) can be found in the instructions field.
        title: Parts Look-up table
      polygons:
        description: The table that contains information about the geometry of a geographic
          area. The short name for the table (partID) can be found in the instructions
          field.
        title: Polygon table
      protocolRelationships:
        description: The table that contains the organizational information and details
          (such as order) about a given protocol, recorded as a series of protocol
          steps (protocolSteps). Protocols are a group of related protocol steps.
          For example a protocol step can describe a sample concentration, extraction,
          inhibition or a measurement. Protocols can include both methodID (a proceedure)
          and measureIDs (a measure). An example of a method is centrifugation; where
          the centriguation rotation speed is described as a measure. The short name
          for the table (partID) can be found in the instructions field.
        title: Protocol relationships table
      protocols:
        description: The table for protocols. The short name for the table (partID)
          can be found in the instructions field.
        title: Protocols table
      protocolSteps:
        description: The table for collecting metadata on individual steps in a protocol,
          methodological process, or assay. The short name for the table (partID)
          can be found in the instructions field.
        title: Protocol steps table
      qualityReports:
        description: The table for recording the various quality metrics and indicators
          for samples and measures. The short name for the table (partID) can be found
          in the instructions field.
        title: Quality reports table
      sampleRelationships:
        description: Table for recording the relationships between samples.Samples
          can be pooled or split. The sample relationships table holds information
          on parent-child relationships between samples, and allow for tracking sample
          lineage for single and pooled samples. The short name for the table (partID)
          can be found in the instructions field.
        title: Sample relationships table
      samples:
        description: The table that contains information about a sample. A sample
          is defined as a representative volume of wastewater (or other forms of water
          or liquid), air, or surface area taken from a site.Samples can be combined,
          split, stored and reused. The `Sample relationships` (sampleRelationships)
          is used to describe the relationships between samples. The short name for
          the table (partID) can be found in the instructions field.
        title: Sample report table
      sets:
        description: Look up table for all sets, managing how categorical inputs for
          various methods and attributes are grouped together. This table manages
          many-to-many relationships and category recycling within the ODM. The short
          name for the table (partID) can be found in the instructions field.
        title: Sets look-up table
      sites:
        description: The table that contains information about a site; the location
          where an environmental sample was taken. The site of an eviromental sample.
          Information in the site table does not regularly change. Consider using
          the MeasureReport table if the infomation changes often. The short name
          for the table (partID) can be found in the instructions field.
        title: Sites table
      translations:
        description: Look up table for translations of the description, label, and
          instruction for all parts. The default language if a translation is not
          specified is English. The short name for the table (partID) can be found
          in the instructions field.
        title: Translation look-up table
      wideNames:
        description: The table for wide names. The short name for the table (partID)
          can be found in the instructions field.
        title: Wide name table
      zones:
        description: Look up table for the possible sub-national region or zone inputs.
          The short name for the table (partID) can be found in the instructions field.
        title: Zones look-up table
