        title: Notes
      version1Category:
        description: ODM V1 category
        title: ODM V1 category
      version1Location:
        description: ODM V1 location
        title: ODM V1 location
      version1Table:
        description: ODM V1 table
        title: ODM V1 table
      version1to2Changes:
        description: Changes for part between ODM v1 and V2
        title: ODM version 1 to 2 changes
      version1Variable:
        description: ODM V1 variable
        title: ODM V1 variable
      aggregationInput:
        description: The partID for the aggregation being used in a wide name.
