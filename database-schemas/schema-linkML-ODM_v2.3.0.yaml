      or measurement.
    title: Protocol table set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      protocols:
        description: The table for protocols. The short name for the table (partID)
          can be found in the instructions field.
        title: Protocols table
      protocolRelationships:
        description: The table that contains the organizational information and details
          (such as order) about a given protocol, recorded as a series of protocol
          steps (protocolSteps). Protocols are a group of related protocol steps.
          For example a protocol step can describe a sample concentration, extraction,
          inhibition or a measurement. Protocols can include both methodID (a proceedure)
          and measureIDs (a measure). An example of a method is centrifugation; where
          the centriguation rotation speed is described as a measure. The short name
          for the table (partID) can be found in the instructions field.
        title: Protocol relationships table
      protocolSteps:
        description: The table for collecting metadata on individual steps in a protocol,
          methodological process, or assay. The short name for the table (partID)
          can be found in the instructions field.
        title: Protocol steps table
      instruments:
        description: The table that contains information about instruments. The short
          name for the table (partID) can be found in the instructions field.
        title: Instrument table
  purposeSet:
    description: Purpose set for a sample or measure.
    title: Purpose set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      education:
        description: A measure or sample taken for education or training.
        title: Education
      multiple:
        description: A measure or sample taken for multiple purposes, not easily captured
          by the other purpose categories.
        title: Multiple Purpose
      provisional:
        description: A provisional or interm report.
        title: Provisional report
      qualityControl:
        description: A measure or sample taken for the purpose of quality control.
        title: Quality control
      regular:
        description: A measure or sample taken for surveillance or epidemiology.
        title: Regular Pathogen Surveillance
      testing:
        description: A measure or sample taken to test a new method. These measures
          are typically used for internal lab uses and not reported to external partners.
        title: Protocol testing
      validationStudy:
        description: A meaure or sample taken for a validation study.
        title: Validation study
      norm:
        description: The purpose of a measure or sample is for normalization.
        title: Purpose is normalization
      cali:
        description: Purpose of calibrating a machine, method, or other.
        title: Calibration purpose
  regularReportTableSet:
    description: Tables used for daily reporting of new measurements and information
      on sample collection.
    title: Regular reports table set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      measures:
        description: The table that contains information and details about a given
          measure. The short name for the table (partID) can be found in the instructions
          field.
        title: Measure report table
      samples:
        description: The table that contains information about a sample. A sample
          is defined as a representative volume of wastewater (or other forms of water
          or liquid), air, or surface area taken from a site.Samples can be combined,
          split, stored and reused. The `Sample relationships` (sampleRelationships)
          is used to describe the relationships between samples. The short name for
          the table (partID) can be found in the instructions field.
        title: Sample report table
  relHumidUnitSet:
    description: Unit set for relative humidity measurements.
    title: Relative humidity unit set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      perc:
        description: Percentage.
        title: Percent
  relSet:
    description: set for valid values of relationshipID across all fields and tables.
    title: General Relationship Set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      before:
        description: Specifies that the object step or protocol occurs before the
          subject step or protocol in the overall protocol container.
        title: Is Before
      concurrent:
        description: Specifies that the object step or protocol occurs at the same
          time as the subject step or protocol in the overall protocol container.
        title: Is concurrent to
      specifies:
        description: Specifies that the object step or protocol occurs specifies details
          for the subject step or protocol in the overall protocol container.
        title: Specifies
      child:
        description: Indicated that this is a sample generated from (an)other sample(s)
          either because of pooling or sub-sampling.
        title: Child relationship
      colocated:
        description: Second or multiples samples collected  at or near (one-half to
          three feet away) from the same selected sample location to determine local
          variability of a given analyte. Analytical results from co-located samples
          can be used to assess site variation, but only in the immediate sampling
          area. Samples at the same location but using different media (i.e. water
          and air samples, soil and sediment samples) are also classified as co-located
          samples.
        title: Co-located relationship
      fieldReplicate:
        description: A sample divided into two or more homogeneous parts.
        title: Field sample replicate
      labDuplicate:
        description: Second (time or more) processing and analysis of sample. Usually
          for general chemistry or metals analyses.
        title: Laboratory duplicate
      lcsd:
        description: Known amounts of an analyte or representative compounds are added
          to a second "clean" matrix (lab water or clean sand) in laboratory. Duplicate
          of LCS
        title: Laboratory control sample duplicate
      msd:
        description: A known amounts of an analyte or representative compounds are
          added in the laboratory to a second aliquot of the sample used for matrix
          spike.
        title: Matrix spike duplicate
      relNR:
        description: A relationship ID used in relationship tables across the ODM
          when two entities are related or connected in some way, but the actual nature
          of that relationship is not clear or reported.
        title: Relationship Not Reported
