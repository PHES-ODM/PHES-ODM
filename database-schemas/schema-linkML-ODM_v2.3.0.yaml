        - range: genMissingnessSet
      specimen:
        description: The substance or thing upon which the observation was made.
        title: Specimen
        notes:
        - 'Specimens include: site, sample, person and population.'
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: specimens
        - range: genMissingnessSet
      fraction:
        description: Fraction of the sample that is analyzed.
        title: Fraction analyzed
        pattern: ^.{0,30}$
        any_of:
        - range: fractionSet
        - range: genMissingnessSet
      group:
        description: Unique identifier for a group of measures. Mostly applicable
          for measures, methods, units, and aggregations.
        title: Group
        notes:
        - A collection of related measures. For example, SARS-CoV-2 is a group. Within
          the SARS-CoV-2 group, there are measure classes tht include RNA alleles
          (N1, N2, E, etc.), mutations, (E484K0), an entire sequence, viral proteins,
          etc. Currently groups are used for measures only.
        pattern: ^.{0,30}$
        any_of:
        - range: groups
        - range: genMissingnessSet
      class:
        description: A unique identifier for a class, which is akin to a sub-group;
          it's a way of grouping parts within a given group. A group can have one
          or more classes to describe different parts of the class.
        title: Class
        notes:
        - Currently, class is only used for biologics. For example, SARS-CoV-2 is
          a group of measures with the following classes of allele, variant, mutation,
          sequence, and protein.
        pattern: ^.{0,30}$
        any_of:
        - range: classes
        - range: genMissingnessSet
      measure:
        description: A measurement or observation of any substance including a biological,
          physical or chemical substance.
        title: Measure
        notes:
        - An measurement is recorded from a specimen (i.e. a site, sample, person
          or population). Measures are organized into groups and classes (sub-groups).
        required: true
        pattern: ^.{0,100}$
        any_of:
        - range: measurements
        - range: genMissingnessSet
      value:
        description: Value of a measure, observation or attribute.
        title: Value
        notes:
        - Only used for the dictionary entries of parts.
        required: true
        pattern: ^.{0,100}$
        any_of:
        - range: string
        - range: genMissingnessSet
      unit:
        description: The units of a measurement.
        title: Unit
        notes:
        - Different units that are used to describe measurement values. Units are
          combined into UnitSetIDs. Please requests new units by creating an issue
          in the ODM repository.
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: units
        - range: genMissingnessSet
      aggregation:
        description: Statistical measures used to report a measure. Each aggregation
          has a corresponding value.
        title: Aggregation
        notes:
        - The default aggregation is `single`, which corresponds to a single measurement.
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: aggregations
        - range: genMissingnessSet
      nomenclature:
        description: A classification system to report the measure class. Only applicable
          to variants, mutations, and diseases.
        title: Nomenclature
        notes:
        - Currently only used for class = variant, mutation, or disease. Valid options
          are currently restricted to 'NextClade', 'Pangolin', 'WHO', or 'ICD'.
        pattern: ^.{0,30}$
        any_of:
        - range: nomenclatures
        - range: genMissingnessSet
      index:
        description: Index number in case the measurement was taken multiple times.
        title: Index
        pattern: ^.{0,50}$
        any_of:
        - range: string
        - range: genMissingnessSet
      measureLic:
        description: Specifies the access and use licensing for a given single measurement.
        title: Measure license
        notes:
        - Populated by partID = licenseID
        pattern: ^.{0,30}$
        any_of:
        - range: licSet
        - range: genMissingnessSet
      reportable:
        description: Flag for whether a measure is reportable or not, based on confidence
          in the measure and methods applied.
        title: Reportable
        pattern: ^.{0,30}$
        any_of:
        - range: booleanSet
        - range: genMissingnessSet
      organizationID:
        description: A unique identifier for the organization to which the reporter
          is affiliated.
        title: Organization ID
        pattern: ^.{0,100}$
        any_of:
        - range: organizations
        - range: genMissingnessSet
      contactID:
        description: A unique identifier for a given contact person.
        title: Contact ID
        pattern: ^.{0,30}$
        any_of:
        - range: contacts
        - range: genMissingnessSet
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        pattern: ^.{0,30}$
        any_of:
        - range: datetime
        - range: genMissingnessSet
      refLink:
        description: Link to the reference material for a part. May link to literature
          on a method, measure, etc.
        title: Reference link
        notes:
        - Link to standard operating procedure for a measure or part. Part reference
          is a reference to a technical document that describes the part in detail.
          The reference could be a URL, DOI, or reference to a techincal report.
        pattern: ^.{0,255}$
        any_of:
        - range: string
        - range: genMissingnessSet
      notes:
        description: A note used to describe details that are not captured in other
          attributes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        pattern: ^.{0,1000}$
        any_of:
        - range: string
        - range: genMissingnessSet
  addresses:
    description: The table that contains information about addresses. Addresses can
      recorded for sites, organizations or contacts (indivduals). The Sites, Organizations,
      and Contacts tables include a link to the addresses table through Address ID.
      The short name for the table (partID) can be found in the instructions field.
    title: Address table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - addressID
    - addL1
    - addL2
    - city
    - stateProvReg
    - pCode
    - country
    - lastEdited
    - notes
    slot_usage:
      addressID:
        description: A unique identifier for an address.
        title: Address ID
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      addL1:
        description: Line 1 (the street name, number and direction) for a given address.
        title: Address Line 1
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: string
        - range: genMissingnessSet
      addL2:
        description: Line 2 (the unit number) for a given address.
        title: Address Line 2
        pattern: ^.{0,30}$
        any_of:
        - range: string
        - range: genMissingnessSet
      city:
        description: The city where a site or organization is located; part of the
          address.
        title: City
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: string
        - range: genMissingnessSet
      stateProvReg:
        description: The state, province, or region where a site or organization is
          located; part of the address.
        title: State, Province, or Region
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: zones
        - range: geoRefMissingnessSet
      pCode:
        description: The zip code or postal code for a given address, specifying a
          specifc geographic area.
        title: Postal or Zip Code
        pattern: ^.{0,30}$
        any_of:
        - range: string
        - range: genMissingnessSet
      country:
        description: The country where a site or organization is located; part of
          the address.
        title: Country
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: countries
        - range: geoRefMissingnessSet
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        pattern: ^.{0,30}$
        any_of:
        - range: datetime
        - range: genMissingnessSet
      notes:
        description: A note used to describe details that are not captured in other
          attributes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        pattern: ^.{0,1000}$
        any_of:
        - range: string
        - range: genMissingnessSet
  parts:
    description: Look up table containing all parts in of the data model. Contains
      all parts, including self-referential parts. The short name for the table (partID)
      can be found in the instructions field.
    title: Parts Look-up table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - partID
    - label
    - partType
    - partDesc
    - partInstr
    - fKAliasID
    - domain
    - specimenSet
    - compartmentSet
    - group
    - class
    - nomenclature
    - ontologyRef
    - latExp
    - mmaSet
    - unitSet
    - aggregationScale
    - aggregationSet
    - qualityIndSet
    - missingnessSet
    - status
    - firstReleased
    - lastUpdated
    - changes
    - protocolSteps
    - protocolStepsRequired
    - protocolStepsOrder
    - protocolRelationships
    - protocolRelationshipsRequired
    - protocolRelationshipsOrder
    - measures
    - measuresRequired
    - measuresOrder
    - measureSets
    - measureSetsOrder
    - measureSetsRequired
    - datasets
    - datasetsRequired
    - datasetsOrder
    - sites
    - sitesRequired
    - sitesOrder
    - samples
    - samplesRequired
    - samplesOrder
    - addresses
    - addressesRequired
    - addressesOrder
    - contacts
    - contactsRequired
    - contactsOrder
    - organizations
    - organizationsRequired
    - organizationsOrder
    - instruments
    - instrumentsRequired
    - instrumentsOrder
    - polygons
    - polygonsRequired
    - polygonsOrder
    - languages
    - languagesRequired
    - languagesOrder
    - translations
    - translationsRequired
    - translationsOrder
    - parts
    - partsRequired
    - partsOrder
    - sets
    - setsRequired
    - setsOrder
    - qualityReports
    - qualityReportsRequired
    - qualityReportsOrder
    - sampleRelationships
    - sampleRelationshipsRequired
    - sampleRelationshipsOrder
    - protocols
    - protocolsRequired
    - protocolsOrder
    - countries
    - countriesRequired
    - countriesOrder
    - zones
    - zonesRequired
    - zonesOrder
    - wideNames
    - wideNamesRequired
    - wideNamesOrder
    - refLink
    - dataType
    - minValue
    - maxValue
    - minLength
    - maxLength
    slot_usage:
      partID:
        description: The unique identify of any entity within the dictionary.
        title: Part identifier
        notes:
        - Every entity in the ODM has a partID. The partID must be unique with no
          duplcates. partIDs are short. partIDs that are constructed by different
          part attributes can be up 28 characters (check max), but each part attibute
          should be 1 to 5 characters. partIDs are machine readible, but a knowledgable
          user can understand what they represent. partID are used, for example, as
          a header in an Excel input table. Numbers are allowed but there no other
          special characters other than `_`. `_` is a reserved character that is used
          to generate a partID using a compoent or table attributes. A partID for
          a subComponent is automatically generated using attributes of a component.
          For example, the partID for the compoent `SARS-CoV-2` is `covid`. `Covid`
          can have many subComponents including different groups (Covid-19-al, Covid-19-va,
          ovid-pr (allele, variant or protein) or units and aggregatrions (i.e. covid-al-N1-mean-cpl
          representing ovid allele N1, mean observation of viral copies per litre
          of effluent). A similar approach to naming subComponent is use for naming
          parts in a reprotTable.
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      label:
        description: A human readable label of a part.
        title: Label
        notes:
        - Typically, a part label has no acrynomns (every word is spelled out). Equivalent
          to a LOINC common name.
        range: string
        required: true
        pattern: ^.{0,30}$
      partType:
        description: The recorded part type for every part in the part table. This
          is the attribute in the parts table, not to be confused with partTypes,
          the part type.
        title: Part type column (Reported)
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: partTypes
        - range: genMissingnessSet
      partDesc:
        description: The description of the part.
        title: Part description
        notes:
        - Provides description of the part, used for tranlsation.
        range: string
        required: true
        pattern: ^.{0,1000}$
      partInstr:
        description: Additional notes and instructions on how a part is used and/or
          defined.
        title: Part instruction
        range: string
        pattern: ^.{0,200}$
      fKAliasID:
        description: The primary key that is being referenced by another name in another
          table as a foreign key.
        title: Foreign Key Alias ID
        notes:
        - For example, in the relationships tables, like sampleRelationships, "sampleIDObj"
          takes the value of a sampleID. It is sampleID as a foreign key, but under
          a different name. This column says what value is actually linked.
        pattern: ^.{0,30}$
        any_of:
        - range: string
        - range: genMissingnessSet
      domain:
        description: Domain is the highest level of describing of a measure.
        title: Domain
        notes:
        - The domain ID that corresponds to a given part. Mostly applicable for measures,
          methods, units, and aggregations.
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: domains
        - range: genMissingnessSet
      specimenSet:
        description: An idenfication of a set of specimens that can be applied for
          a measure or method.
        title: Specimen Set Header
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: specimenSets
        - range: genMissingnessSet
      compartmentSet:
        description: An idenfication of a set of compartments that can be applied
          for a measure or method.
        title: Compartment Set Header
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: compartmentSets
        - range: genMissingnessSet
      group:
        description: Unique identifier for a group of measures. Mostly applicable
          for measures, methods, units, and aggregations.
        title: Group
        notes:
        - A collection of related measures. For example, SARS-CoV-2 is a group. Within
          the SARS-CoV-2 group, there are measure classes tht include RNA alleles
          (N1, N2, E, etc.), mutations, (E484K0), an entire sequence, viral proteins,
          etc. Currently groups are used for measures only.
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: groups
        - range: genMissingnessSet
      class:
        description: A unique identifier for a class, which is akin to a sub-group;
          it's a way of grouping parts within a given group. A group can have one
          or more classes to describe different parts of the class.
        title: Class
        notes:
        - Currently, class is only used for biologics. For example, SARS-CoV-2 is
          a group of measures with the following classes of allele, variant, mutation,
          sequence, and protein.
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: classes
        - range: genMissingnessSet
      nomenclature:
        description: A classification system to report the measure class. Only applicable
          to variants, mutations, and diseases.
        title: Nomenclature
        notes:
        - Currently only used for class = variant, mutation, or disease. Valid options
          are currently restricted to 'NextClade', 'Pangolin', 'WHO', or 'ICD'.
        pattern: ^.{0,30}$
        any_of:
        - range: nomenclatures
        - range: genMissingnessSet
      ontologyRef:
        description: Ontology reference for a part.
        title: Ontology reference
        notes:
        - This field contains a link to an existing ontology reference for the part.
          ODM content spans several existing ontologies. ODM does not strive to generate
          a new ontology, rather ODM seeks to harmonize and extend dictionaries for
          application in environmental and public health surveillance.
        range: string
        pattern: ^.{0,200}$
      latExp:
        description: LaTeX expression used to generate formulas, symbols, etc.  Mainly
          relevant for units.
        title: LaTeX expression
        range: string
        pattern: ^.{0,30}$
      mmaSet:
        description: The set for a measure, method, or attribute. Only applicable
          for categorical fields, and the categories that populate them. The use has
          meean extended to include 'partType' values as well, to codify instances
          where a catgeorical variable takes any part of a certain part type.
        title: Measure, Method, or Attribute Set Header
        notes:
        - Examples of the part type use case insclude using the 'measurements' partType
          in this column to illustrate that the part 'measure' takes any part of that
          part type as a valid entry.
        pattern: ^.{0,30}$
        any_of:
        - range: mmaSets
        - range: genMissingnessSet
      unitSet:
        description: An idenfication of a set of units that can be used for a measure
          or method.
        title: Unit set
        pattern: ^.{0,30}$
        any_of:
        - range: unitSets
        - range: genMissingnessSet
      aggregationScale:
        description: A scale used for an aggregation. Only applicable for measures
          and units.
        title: Aggregation scale
        pattern: ^.{0,30}$
        any_of:
        - range: aggregationScales
        - range: genMissingnessSet
      aggregationSet:
        description: The aggregation set for a unit.
        title: Aggregation set
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: aggregationSets
        - range: genMissingnessSet
      qualityIndSet:
        description: The quality set that corresponds to a given part. Only applicable
          for samples and measures.
        title: Quality Indicator Set Header
        pattern: ^.{0,30}$
        any_of:
        - range: qualityIndSets
        - range: genMissingnessSet
      missingnessSet:
        description: Missingness sets for measures, methods or attributes.
        title: Missingness Set
        notes:
        - Inputted data into an ODM field may have missing data. The missingness set
          lists valid missing categories for the measure, method, or attribute.
        pattern: ^.{0,30}$
        any_of:
        - range: missingnessSets
        - range: genMissingnessSet
      status:
        description: Whether the part is still active and can be used in the most
          current ODM version. Values are 'active' or 'inactive'.
        title: Status
        notes:
        - The status of the part or list. 'active' means the part is used in the dictionary
          version. 'inactive' means the part has been retired and not longer used
          in the version.
        range: statusSet
        required: true
        pattern: ^.{0,30}$
      firstReleased:
        description: The version in which a part was first released
        title: First released version
        range: string
        required: true
        pattern: ^.{0,30}$
      lastUpdated:
        description: The version in which the part was last updated.
        title: Last updated version
        notes:
        - Any change to the part of list will result in a change in the lastUpdated
          field to the dictionary version where the update occurred.
        range: string
        required: true
        pattern: ^.{0,30}$
      changes:
        description: A column for recording the changes from a previous version.
        title: Changes column
        notes:
        - Use this column as a short-hand change log for dictionary development.
        range: string
        pattern: ^.{0,30}$
      protocolSteps:
        description: The table for collecting metadata on individual steps in a protocol,
          methodological process, or assay. The short name for the table (partID)
          can be found in the instructions field.
        title: Protocol steps table
        notes:
        - ps
        range: string
        pattern: ^.{0,30}$
      protocolStepsRequired:
        description: Specifies the columns required in a Protocol Steps table.
        title: Protocol steps table required headers
        range: string
        pattern: ^.{0,30}$
      protocolStepsOrder:
        description: Specifies the order of the columns in a Protocol Steps table.
        title: Protocol steps table column order
        range: integer
        minimum_value: 1
      protocolRelationships:
        description: The table that contains the organizational information and details
          (such as order) about a given protocol, recorded as a series of protocol
          steps (protocolSteps). Protocols are a group of related protocol steps.
          For example a protocol step can describe a sample concentration, extraction,
          inhibition or a measurement. Protocols can include both methodID (a proceedure)
          and measureIDs (a measure). An example of a method is centrifugation; where
          the centriguation rotation speed is described as a measure. The short name
          for the table (partID) can be found in the instructions field.
        title: Protocol relationships table
        notes:
        - pr
        range: string
        pattern: ^.{0,30}$
      protocolRelationshipsRequired:
        description: Specifies the columns required in the Protocol Organization table.
        title: Protocol Relationship table required headers
        range: string
        pattern: ^.{0,30}$
      protocolRelationshipsOrder:
        description: Specifies the order of the columns in the Protocol Organization
          table.
        title: Protocol relationships table column order
        range: integer
        minimum_value: 1
      measures:
        description: The table that contains information and details about a given
          measure. The short name for the table (partID) can be found in the instructions
          field.
        title: Measure report table
        notes:
        - mr
        range: string
        pattern: ^.{0,30}$
      measuresRequired:
        description: Specifies the columns required in a Measures table.
        title: Measures table required headers
        range: string
        pattern: ^.{0,30}$
      measuresOrder:
        description: Specifies the order of the columns in a Measures table.
        title: Measures table column order
        range: integer
        minimum_value: 1
      measureSets:
        description: The table that identifies sets of measures. Examples of measure
          sets include a set of replicates, dilutions (used to generate a Ct curve)
          or varients that are identified in a single sample. The short name for the
          table (partID) can be found in the instructions field.
        title: Measure set report table
        notes:
        - ms
        range: string
        pattern: ^.{0,30}$
      measureSetsOrder:
        description: Specifies the order of the columns in a Measure Sets table.
        title: Measure sets table column order
        range: integer
        minimum_value: 1
      measureSetsRequired:
        description: Specifies the columns required in a Measure Sets table.
        title: Measure Set table required headers
        range: string
        pattern: ^.{0,30}$
      datasets:
        description: A report table for capturing details about data's parental data
          set and data custodians. Supplying attribution for data collectors. The
          short name for the table (partID) can be found in the instructions field.
        title: Dataset table
        notes:
        - ds
        range: string
        pattern: ^.{0,30}$
      datasetsRequired:
        description: Specifies the columns required in a Datasets table.
        title: Dataset table required headers
        range: string
        pattern: ^.{0,30}$
      datasetsOrder:
        description: Specifies the order of the columns in a Datasets table.
        title: Datasets table column order
        range: integer
        minimum_value: 1
      sites:
        description: The table that contains information about a site; the location
          where an environmental sample was taken. The site of an eviromental sample.
          Information in the site table does not regularly change. Consider using
          the MeasureReport table if the infomation changes often. The short name
          for the table (partID) can be found in the instructions field.
        title: Sites table
        notes:
        - si
        range: string
        pattern: ^.{0,30}$
      sitesRequired:
        description: Specifies the columns required in a Sites table.
        title: Sites table required headers
        range: string
        pattern: ^.{0,30}$
      sitesOrder:
        description: Specifies the order of the columns in a Sites table.
        title: Sites table column order
        range: integer
        minimum_value: 1
      samples:
        description: The table that contains information about a sample. A sample
          is defined as a representative volume of wastewater (or other forms of water
          or liquid), air, or surface area taken from a site.Samples can be combined,
          split, stored and reused. The `Sample relationships` (sampleRelationships)
          is used to describe the relationships between samples. The short name for
          the table (partID) can be found in the instructions field.
        title: Sample report table
        notes:
        - sas
        range: string
        pattern: ^.{0,30}$
      samplesRequired:
        description: Specifies the columns required in a Samples table.
        title: Sample table required headers
        range: string
        pattern: ^.{0,30}$
      samplesOrder:
        description: Specifies the order of the columns in a Samples table.
        title: Samples table column order
        range: integer
        minimum_value: 1
      addresses:
        description: The table that contains information about addresses. Addresses
          can recorded for sites, organizations or contacts (indivduals). The Sites,
          Organizations, and Contacts tables include a link to the addresses table
          through Address ID. The short name for the table (partID) can be found in
          the instructions field.
        title: Address table
        notes:
        - ad
        range: string
        pattern: ^.{0,30}$
      addressesRequired:
        description: Specifies the columns required in a Addresses table.
        title: Address table required headers
        range: string
        pattern: ^.{0,30}$
      addressesOrder:
        description: Specifies the order of the columns in the Addresses table.
        title: Addresses table column order
        range: integer
        minimum_value: 1
