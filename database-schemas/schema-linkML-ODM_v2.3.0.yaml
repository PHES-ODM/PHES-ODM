        title: Secondary reporting authority ID
      setID:
        description: The unique identifier of a value set.
        title: Set ID
      geoLat:
        description: 'Geographical location, latitude in decimal coordinates, ie.:
          (45.424721)'
        title: Latitude
      sentDate:
        description: Date that the sample was sent from the collection site to the
