  protocolSteps:
    description: The table for collecting metadata on individual steps in a protocol,
      methodological process, or assay. The short name for the table (partID) can
      be found in the instructions field.
    title: Protocol steps table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - stepID
    - method
    - measure
    - summ
    - sourceStep
    - stepVer
    - refLink
    - organizationID
    - contactID
    - instrumentID
    - value
    - unit
    - aggregation
    - lastEdited
    - notes
    slot_usage:
      stepID:
        description: The unique identifier for a specific protocol step.
        title: Protocol Step ID
        notes:
        - Protocol Steps are the component parts of a larger protocols, the latter
          being linked to specific measure reports.
        identifier: true
        range: string
        required: true
        pattern: ^.{0,30}$
      method:
        description: A procedure for collecting a sample or performing a measure.
        title: Method
        pattern: ^.{0,30}$
        any_of:
        - range: methods
        - range: genMissingnessSet
      measure:
        description: A measurement or observation of any substance including a biological,
          physical or chemical substance.
        title: Measure
        notes:
        - An measurement is recorded from a specimen (i.e. a site, sample, person
          or population). Measures are organized into groups and classes (sub-groups).
        pattern: ^.{0,100}$
        any_of:
        - range: measurements
        - range: genMissingnessSet
      summ:
        description: Short description of the assay and how it is different from the
          other assay methods.
        title: Summary
        pattern: ^.{0,1000}$
        any_of:
        - range: string
        - range: genMissingnessSet
      sourceStep:
        description: Specifies the protocol step which serves as a basis for a given
          protocol step.
        title: Protocol step source ID
        notes:
        - Populate with a protocol step ID (stepID).
        pattern: ^.{0,30}$
        any_of:
        - range: protocolSteps
        - range: genMissingnessSet
      stepVer:
        description: Specifies the version of a given protocol step.
        title: Protocol step version
        notes:
        - Version of the method step. Semantic versioning is recommended.
        pattern: ^.{0,50}$
        any_of:
        - range: string
        - range: genMissingnessSet
      refLink:
        description: Link to the reference material for a part. May link to literature
          on a method, measure, etc.
        title: Reference link
        notes:
        - Link to standard operating procedure for a measure or part. Part reference
          is a reference to a technical document that describes the part in detail.
          The reference could be a URL, DOI, or reference to a techincal report.
        pattern: ^.{0,255}$
        any_of:
        - range: string
        - range: genMissingnessSet
      organizationID:
        description: A unique identifier for the organization to which the reporter
          is affiliated.
        title: Organization ID
        pattern: ^.{0,100}$
        any_of:
        - range: organizations
        - range: genMissingnessSet
      contactID:
        description: A unique identifier for a given contact person.
        title: Contact ID
        pattern: ^.{0,30}$
        any_of:
        - range: contacts
        - range: genMissingnessSet
      instrumentID:
        description: A unique identifier for an instrument.
        title: Instrument ID
        pattern: ^.{0,30}$
        any_of:
        - range: instruments
        - range: genMissingnessSet
      value:
        description: Value of a measure, observation or attribute.
        title: Value
        notes:
        - Only used for the dictionary entries of parts.
        pattern: ^.{0,100}$
        any_of:
        - range: string
        - range: genMissingnessSet
      unit:
        description: The units of a measurement.
        title: Unit
        notes:
        - Different units that are used to describe measurement values. Units are
          combined into UnitSetIDs. Please requests new units by creating an issue
          in the ODM repository.
        pattern: ^.{0,30}$
        any_of:
        - range: units
        - range: genMissingnessSet
      aggregation:
        description: Statistical measures used to report a measure. Each aggregation
          has a corresponding value.
        title: Aggregation
        notes:
        - The default aggregation is `single`, which corresponds to a single measurement.
        pattern: ^.{0,30}$
        any_of:
        - range: aggregations
        - range: genMissingnessSet
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        pattern: ^.{0,30}$
        any_of:
        - range: datetime
        - range: genMissingnessSet
      notes:
        description: A note used to describe details that are not captured in other
          attributes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        pattern: ^.{0,1000}$
        any_of:
        - range: string
        - range: genMissingnessSet
  protocols:
