        pattern: ^.{0,30}$
        any_of:
        - range: aggregations
        - range: genMissingnessSet
      aggregationInput:
        description: The partID for the aggregation being used in a wide name.
        title: Aggregation input (wide table)
        pattern: ^.{0,30}$
        any_of:
        - range: aggregations
        - range: genMissingnessSet
      index:
        description: Index number in case the measurement was taken multiple times.
        title: Index
        pattern: ^.{0,50}$
        any_of:
        - range: string
        - range: genMissingnessSet
      attributeName:
        description: The attribute referenced for the wide name.
        title: Attribute name (wide table)
        pattern: ^.{0,30}$
        any_of:
        - range: attributes
        - range: genMissingnessSet
      attributeInput:
        description: The partID for the attribute being used in a wide name.
        title: Attribute input (wide table)
        pattern: ^.{0,30}$
        any_of:
        - range: attributes
        - range: genMissingnessSet
      tag:
        description: A tag used in wide names to clarify relationship and linkage
          in the flattened, single table format.
        title: Wide name measurement and linkage tag
        notes:
        - "If a column doesn\u2019t have tag value at the end, then it means it applies\
          \ to all groups, while one with a tag only applie to fields with the same\
          \ tag value. For example, a value under qr_qualityFlag (with no tag) applies\
          \ to fields in the group with tag == .odm10 and all other groups. If there\u2019\
          s a column called qr_qualityFlag.odm10, however, then the group with that\
          \ .odm10 tag uses the value from qr_qualityFlag.odm10 instead of from qr_qualityFlag\
          \ (like wat_sa_nr_hMe_hUn_hAg_NR_value.odm10 and mr_unit.odm10, for example)."
        pattern: ^.{0,8}$
        any_of:
        - range: string
        - range: genMissingnessSet
  zones:
    description: Look up table for the possible sub-national region or zone inputs.
      The short name for the table (partID) can be found in the instructions field.
    title: Zones look-up table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - isoCode
    - isoZone
    - zoneName
    slot_usage:
      isoCode:
        description: The ISO 3166-1 alpha-2 code, a two-letter country code which
          is also used to create the ISO 3166-2 country subdivision code and the Internet
          country code top-level domain.
        title: ISO 3166-1 alpha-2 country code
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        required: true
        pattern: ^.{2,2}$
        any_of:
        - range: countries
        - range: genMissingnessSet
      isoZone:
        description: The ISO 3166-2 codes for the names of the principal subdivisions
          (e.g., provinces, states, departments, regions) of all countries coded in
          ISO 3166-1.
        title: ISO 3166-2 code for country sub-domain
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        identifier: true
        range: string
        required: true
        pattern: ^.{4,6}$
      zoneName:
        description: The english-language name for a given country sub-domain.
        title: English name of country sub-domains
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        required: true
        pattern: ^.{0,75}$
        any_of:
        - range: string
        - range: genMissingnessSet
  translations:
    description: Look up table for translations of the description, label, and instruction
      for all parts. The default language if a translation is not specified is English.
      The short name for the table (partID) can be found in the instructions field.
    title: Translation look-up table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - translationID
    - lang
    - partID
    - label
    - partDesc
    - partInstr
    - firstReleased
    - lastUpdated
    - changes
    - notes
    slot_usage:
      translationID:
        description: A unique, autoincremental ID generated to produce a unique identifier
          and primary key for each row of the translations table.
        title: Synthetic ID for the translations table
        identifier: true
        range: string
        required: true
        pattern: ^.{0,50}$
      lang:
        description: Language code for translation purposes. Specifies the langage
          for each translation, other than the default English. Uses the ISO-6393
          code.
        title: Language ID
        notes:
        - Follow the ISO639-3 codes for now.
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: languages
        - range: genMissingnessSet
      partID:
        description: The unique identify of any entity within the dictionary.
        title: Part identifier
        notes:
        - Every entity in the ODM has a partID. The partID must be unique with no
          duplcates. partIDs are short. partIDs that are constructed by different
          part attributes can be up 28 characters (check max), but each part attibute
          should be 1 to 5 characters. partIDs are machine readible, but a knowledgable
          user can understand what they represent. partID are used, for example, as
          a header in an Excel input table. Numbers are allowed but there no other
          special characters other than `_`. `_` is a reserved character that is used
          to generate a partID using a compoent or table attributes. A partID for
          a subComponent is automatically generated using attributes of a component.
          For example, the partID for the compoent `SARS-CoV-2` is `covid`. `Covid`
          can have many subComponents including different groups (Covid-19-al, Covid-19-va,
          ovid-pr (allele, variant or protein) or units and aggregatrions (i.e. covid-al-N1-mean-cpl
          representing ovid allele N1, mean observation of viral copies per litre
          of effluent). A similar approach to naming subComponent is use for naming
          parts in a reprotTable.
        range: parts
        required: true
        pattern: ^.{0,30}$
      label:
        description: A human readable label of a part.
        title: Label
        notes:
        - Typically, a part label has no acrynomns (every word is spelled out). Equivalent
          to a LOINC common name.
        range: string
        required: true
        pattern: ^.{0,30}$
      partDesc:
        description: The description of the part.
        title: Part description
        notes:
        - Provides description of the part, used for tranlsation.
        range: string
        required: true
        pattern: ^.{0,1000}$
      partInstr:
        description: Additional notes and instructions on how a part is used and/or
          defined.
        title: Part instruction
        range: string
        pattern: ^.{0,200}$
      firstReleased:
        description: The version in which a part was first released
        title: First released version
        range: string
        required: true
        pattern: ^.{0,30}$
      lastUpdated:
        description: The version in which the part was last updated.
        title: Last updated version
        notes:
        - Any change to the part of list will result in a change in the lastUpdated
          field to the dictionary version where the update occurred.
        range: string
        required: true
        pattern: ^.{0,30}$
      changes:
        description: A column for recording the changes from a previous version.
        title: Changes column
        notes:
        - Use this column as a short-hand change log for dictionary development.
        range: string
        pattern: ^.{0,30}$
      notes:
        description: A note used to describe details that are not captured in other
          attributes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        pattern: ^.{0,1000}$
        any_of:
        - range: string
        - range: genMissingnessSet
  sampleRelationships:
    description: Table for recording the relationships between samples.Samples can
      be pooled or split. The sample relationships table holds information on parent-child
      relationships between samples, and allow for tracking sample lineage for single
      and pooled samples. The short name for the table (partID) can be found in the
      instructions field.
    title: Sample relationships table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - sampleRelationshipsID
    - sampleIDSubject
    - relationshipID
    - sampleIDObject
    - lastEdited
    - notes
    slot_usage:
      sampleRelationshipsID:
        description: A unique, autoincremental ID generated to produce a unique identifier
          and primary key for each row of the sampleRelationships table.
        title: Synthetic ID for the sampleRelationships table
        identifier: true
        range: string
        required: true
        pattern: ^.{0,50}$
      sampleIDSubject:
        description: Populated by `sampleID` - this specifies the subject of a sample
          relationship.
        title: Sample ID subject
        notes:
        - 'Use `sampleID` for this field. Together with `sampleIDSub` and `relationshipID`
          the row of the `sampleRelationships` should say: [sampleIDSubject] is a[relationshipID]
          of [sampleIDObject]'
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: samples
        - range: genMissingnessSet
      relationshipID:
        description: Attribute for specifying the relationship between a sample subject
          and object.
        title: Relationship between entities
        notes:
        - 'Together with `sampleIDSubject` and `sampleRelID`, a row of the `sampleRelationships`
          should say: [sampleIDSubject] is a [sampleID] of [sampleIDObject]'
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: relSet
        - range: genMissingnessSet
      sampleIDObject:
        description: Populated by `sampleID` - this specifies the object of a sample
          relationship.
        title: Sample ID object
        notes:
        - 'Use `sampleID` for this field. Together with `sampleIDSub` and `relationshipID`
          the row of the `sampleRelationships` should say: [sampleIDSubject] is a[relationshipID]
          of [sampleIDObject]'
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: samples
        - range: genMissingnessSet
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        pattern: ^.{0,30}$
        any_of:
        - range: datetime
        - range: genMissingnessSet
      notes:
        description: A note used to describe details that are not captured in other
          attributes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        pattern: ^.{0,1000}$
        any_of:
        - range: string
        - range: genMissingnessSet
  instruments:
    description: The table that contains information about instruments. The short
