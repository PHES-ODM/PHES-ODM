          `protocolIDObj` or `stepIDObj` and `relationshipID` the row of `protocolRelationships`
          should say: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        pattern: ^.{0,30}$
        any_of:
        - range: protocols
        - range: genMissingnessSet
      stepIDSub:
        description: The subject of the relationship between one protocol step and
          another step or protocol, within a given protocol ID container.
        title: Step ID Subject
        notes:
        - 'Populate this field using Protocol ID (partID = stepID). Together with
          `protocolIDSub` or `stepIDSub` and `relationshipID` the row of `protocolRelationships`
          should say: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        pattern: ^.{0,30}$
        any_of:
        - range: protocolSteps
        - range: genMissingnessSet
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
        notes:
        - Use lastEdited if an entry is updated. Leave lastEdited blank or 'NA' for
          the first entry. Updates can include additions or revisions of the entry
          for any reason. For example, a wastewater measure was repeated later with
          an improved method. You can revise the entry by updating the value and then
          adding the date the new measure was performed to 'lastEdited'.  To ensure
          data provenance, the best practice in this example is to generate a new
          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        pattern: ^.{0,30}$
        any_of:
        - range: datetime
        - range: genMissingnessSet
      notes:
        description: A note used to describe details that are not captured in other
          attributes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        pattern: ^.{0,1000}$
        any_of:
        - range: string
        - range: genMissingnessSet
  countries:
    description: Look up table for the possible country inputs. The short name for
      the table (partID) can be found in the instructions field.
    title: Countries look-up tables
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - isoCode
    - isoCodeX
    - numCode
    - tld
    - nameEngl
    - nameOfficial
    - sovereignty
    - countryExonym
    - capitalExonym
    - countryEndonym
    - capitalEndonym
    - langScript
    - phone
    - utc
    - utcDST
    slot_usage:
      isoCode:
        description: The ISO 3166-1 alpha-2 code, a two-letter country code which
          is also used to create the ISO 3166-2 country subdivision code and the Internet
          country code top-level domain.
        title: ISO 3166-1 alpha-2 country code
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        identifier: true
        range: string
        required: true
        pattern: ^.{2,2}$
      isoCodeX:
        description: The ISO 3166-1 alpha-3 code, a three-letter country code which
          may allow a better visual association between the code and the country names
          than the 3166-1 alpha-2 code.
        title: ISO 3166-1 alpha-3 country code
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        required: true
        pattern: ^.{3,3}$
        any_of:
        - range: string
        - range: genMissingnessSet
      numCode:
        description: The ISO 3166-1 numeric code, a three-digit country code which
          is identical to that developed and maintained by the United Nations Statistics
          Division, with the advantage of script (writing system) independence, and
          hence useful for people or systems using non-Latin scripts.
        title: ISO 3166-1 numeric country code
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        required: true
        pattern: ^.{3,3}$
        any_of:
        - range: string
        - range: genMissingnessSet
      tld:
        description: The internet top-level domain generally used or reserved for
          a country, sovereign state, or dependent territory identified with a country
          code.
        title: Country code top-level domain
        notes:
        - Preprogrammed into dictionary tables, not editable by users.
        required: true
        pattern: ^.{3,3}$
        any_of:
        - range: string
        - range: genMissingnessSet
      nameEngl:
        description: English-language name of a given country.
