          entry with the same measureID as the original measureID. The original and
          new measures are kept in the database with a date in the 'lastEdited' field
          for the new entry but not the original one. Some databases may choose a
          delete-and-replace approach where the original entry is deleted and replaced
          by a new entry. In this approach, the 'lastEdited' field indicates the delete
          and replace occurred.
        pattern: ^.{0,30}$
        any_of:
        - range: datetime
        - range: genMissingnessSet
      notes:
        description: A note used to describe details that are not captured in other
          attributes
        title: Notes
        notes:
        - There is no recommended structure of a note. Use notes as needed.
        pattern: ^.{0,1000}$
        any_of:
        - range: string
        - range: genMissingnessSet
