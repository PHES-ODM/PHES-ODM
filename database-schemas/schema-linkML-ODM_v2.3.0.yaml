name: ODMv2
description: Data model for the Public Health Environmental Surveillance Open Data
  Model, version 2
id: https://onto.phes-odm.org/odm/v2
imports:
- linkml:types
prefixes:
  odmv2: https://onto.phes-odm.org/odm/v2/
  linkml: https://w3id.org/linkml/
default_prefix: odmv2
default_range: string
enums:
  aggregationScales:
    description: The scale of an aggregation set. Aggregation scales include quantitative
      and qualitative.
    title: Aggregation scales
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      naAggrScale:
        description: Not application for aggregation sets.
        title: Aggregation scale not applicable
      othAgg:
        description: Specifies an aggregation scale that can't be described as either
          "qualitative" or "quantitative".
        title: Other aggregation scale
      qualAggScale:
        description: The qualitative aggregation scale.
        title: Qualitative
      quantAggScale:
        description: The "quantAggScale" aggregation scale.
        title: Quantitative
      seeUnitAggScale:
        description: A value for aggregation scale to be used when the aggregation
          scale depends on that specified in the parts list entry for the unit.
        title: See unit (aggregation scales)
  aggregationSets:
    description: Sets of aggregations. Examples of aggregation sets include logarithm,
      linear and boolean.
    title: Aggregation sets
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      booleanAggrSet:
        description: Aggreagation set for boolean.
        title: Boolean aggregation set
      linearAggrSet:
        description: The aggregation set that contains all aggregations that exist
          on the linear scale.
        title: Linear scale aggregation set
      logAggrSet:
        description: The aggregation set that contains all aggregations that exist
          on the logarithmic scale (rather than linear or qualitative).
        title: Logarithmic scale aggregation set
      naAggrSet:
        description: Not application for aggregation sets.
        title: Aggregation set not applicable
      otherAggrSet:
        description: Aggregation set used for unitless measures.
        title: Other aggregation set
  aggregations:
    description: Statistical measures used to report a measure. Each measure reported
      as a number should be reported with an aggregation. The default aggregation
      is `sin`, which corresponds to a single measurement.
    title: Aggregations
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      andBoo:
        description: '"AND" aggreation.'
        title: AND Boolean aggregation
      cuCo:
        description: The cumulative count of cases of a given disease.
        title: Cumulative count
      daiCo:
        description: The daily count of cases of a given disease.
        title: Daily count
      floMean:
        description: Mean measure normalized to wastewater flow.
        title: Flow-normalized mean
      gmn:
        description: Geometric mean.
        title: Geometric mean
      hAg:
        description: An indicator to show in a wide-name that aggregation information
          is located in a different column.
        title: See Header for Aggregation
      lowerCI95:
        description: Specifies the the lower limit of a 95% confidence interval.
        title: Lower limit of a 95% confidence interval
      maxVal:
        description: Highest value in a range of values for a measure.
        title: Maximum value
      me:
        description: Arithmetic mean.
        title: Arithmetic mean
      med:
        description: Median.
        title: Median
      menr:
        description: Arithmetic mean, normalized.
        title: Normalized arithmetic mean
      minVal:
        description: Lowest value in a range of values for a measure.
        title: Minimum value
      naAggr:
        description: Not applicable for aggregations.
        title: Aggregation not applicable
      ngmn:
        description: Geometric mean, normalized.
        title: Normalized geometric mean
      orBoo:
        description: '"OR" aggreation.'
        title: OR Boolean aggregation
      pmFloMean:
        description: Mean measure normalized to amount of PMMoV and wastewater flow.
        title: PMMoV- and flow-normalized mean
      pmmovNorm:
        description: Mean measure normalized to amount of PMMoV.
        title: PMMoV-normalized mean
      sd:
        description: Standard deviation.
        title: Standard deviation
      sdn:
        description: Standard deviation, normalized.
        title: Normalized standard deviation
      sin:
        description: A value that is not an aggregate measurement (ie. not a mean,
          median, max or any other) and can be a replicate value.
        title: Single
      stEr:
        description: The standard error of a series of measurements.
        title: Standard Error
      sum14:
        description: The rolling sum of case counts/some kind of count over the previous
          14 days.
        title: Rolling sum of previous 14 days
      total:
        description: The total number or final count of cases, or other defined metric.
        title: Total amount or count - the sum
      upperCI95:
        description: Specifies the the upper limit of a 95% confidence interval.
        title: Upper limit of a 95% confidence interval
  attributes:
    name: attributes
    description: Attributes describe the who, where, when, and why of environmental
      surveillance. There are attributes for domain, specimen, compartment, or table.
      Attributes are one of the three main components or ways to report environment
      surviellence data. The other two components are measures and methods.
    title: Attributes
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      wideName:
        description: 'Unique identifier for wide table only. Use when all measures
          are performed on a single sample at the same time and same laboratory. Suggestion:
          siteID_sampleID_LabID_reportDate_ID.'
        title: Wide Name
      addressID:
        description: A unique identifier for an address.
        title: Address ID
      aDateEnd:
        description: Date the measurement or analysis was completed.
        title: Analysis date end
      aDateStart:
        description: Date the measurement or analysis was started.
        title: Analysis date start
      addL1:
        description: Line 1 (the street name, number and direction) for a given address.
        title: Address Line 1
      fKAliasID:
        description: The primary key that is being referenced by another name in another
          table as a foreign key.
        title: Foreign Key Alias ID
      setCompID:
        description: A composite ID generated by concatennating the 'setID' and 'partID'
          of a given row in the sets table. This allows for a unique primary key and
          robust relational database structure.
        title: Composite Set ID
      aggregationScale:
        description: A scale used for an aggregation. Only applicable for measures
          and units.
        title: Aggregation scale
      aggregation:
        description: Statistical measures used to report a measure. Each aggregation
          has a corresponding value.
        title: Aggregation
      charLength:
        description: The number of characters used for the wide names.
        title: character length
      domain:
        description: Domain is the highest level of describing of a measure.
        title: Domain
      contactID:
        description: A unique identifier for a given contact person.
        title: Contact ID
      aggregationSet:
        description: The aggregation set for a unit.
        title: Aggregation set
      custodyCont:
        description: A unique identifier for data custodians.
        title: Custody Contact ID
      descr:
        description: A detailed description of a measure, method, or attribute.
        title: Description
      source:
        description: The database or table sourced for the wide name.
        title: Wide name source
      custodyID:
        description: The data custodian of a database.
        title: Data custodian ID
      datasetID:
        description: The name of the dataset that stores information for MeasureReport,
          SampleReport and other reporting tables.
        title: Dataset ID
      specimenSet:
        description: An idenfication of a set of specimens that can be applied for
          a measure or method.
        title: Specimen Set Header
      compartmentSet:
        description: An idenfication of a set of compartments that can be applied
          for a measure or method.
        title: Compartment Set Header
      group:
        description: Unique identifier for a group of measures. Mostly applicable
          for measures, methods, units, and aggregations.
        title: Group
      capitalEndonym:
        description: "The name locals use for their country\u2019s capital."
        title: Capital city endonym
      capitalExonym:
        description: "The English name foreigners use for the country\u2019s capital."
        title: Capital city exonym
      funderCont:
        description: A unique identifier for a funder.
        title: Funder contact ID
      class:
        description: A unique identifier for a class, which is akin to a sub-group;
          it's a way of grouping parts within a given group. A group can have one
          or more classes to describe different parts of the class.
        title: Class
      wideMeasure:
        description: Unique identifier for a measure in a wide table only.
        title: Measure identification (wide table)
      addL2:
        description: Line 2 (the unit number) for a given address.
        title: Address Line 2
      nomenclature:
        description: A classification system to report the measure class. Only applicable
          to variants, mutations, and diseases.
        title: Nomenclature
      collDT:
        description: For grab samples this is the date, time and timezone the sample
          was taken.
        title: Collection date time
      collDTEnd:
        description: For integrated time average samples this is the date, time and
          timezone the sample was finished being taken.
        title: Collection date time end
      collDTStart:
        description: For integrated time averaged samples this is the date, time and
          timezone the sample was started being taken.
        title: Collection date time start
      collNum:
        description: The number of subsamples that were combined to create the sample.
          Use NA for continuous, proportional or passive sampling.
        title: Collection number
      collPer:
        description: Collection period. The time period over which the sample was
          collected, in hours. Alternatively, use collectionStart and collectionEnd.
        title: Collection period
      collType:
        description: The type of collection.
        title: Sample collection type
      compartment:
        description: The attribute identifying the substance from which where a sample
          was taken. For more information, see partID = compartment.
        title: Compartment
      wideProtocol:
        description: Unique identifier for a protocol in a wide table only.
        title: Specified protocol (wide table)
      wideAttribute:
        description: Unique identifier for an attribute in a wide table only.
        title: Specified attribute (wide table)
      method:
        description: A procedure for collecting a sample or performing a measure.
        title: Method
      mmaSet:
        description: The set for a measure, method, or attribute. Only applicable
          for categorical fields, and the categories that populate them. The use has
          meean extended to include 'partType' values as well, to codify instances
          where a catgeorical variable takes any part of a certain part type.
        title: Measure, Method, or Attribute Set Header
      unitSet:
        description: An idenfication of a set of units that can be used for a measure
          or method.
        title: Unit set
      funderID:
        description: The funding agency of the dataset.
        title: Funding agency ID
      qualityIndSet:
        description: The quality set that corresponds to a given part. Only applicable
          for samples and measures.
        title: Quality Indicator Set Header
      city:
        description: The city where a site or organization is located; part of the
          address.
        title: City
      countryEndonym:
        description: The name locals use for their country.
        title: Country endonym
      countryExonym:
        description: The English name foreigners use for the country.
        title: Country exonym
      instrumentID:
        description: A unique identifier for an instrument.
        title: Instrument ID
      datasetDate:
        description: Specifies the date a given dataset was created.
        title: Dataset creation date
      lang:
        description: Language code for translation purposes. Specifies the langage
          for each translation, other than the default English. Uses the ISO-6393
          code.
        title: Language ID
      missingnessSet:
        description: Missingness sets for measures, methods or attributes.
        title: Missingness Set
      wideNameType:
        description: The type of wide name generated. Possible options are measure,
          protocol or attribute.
        title: Wide name type
      enaMap:
        description: ENA header
        title: European Nucleotide Association Mapping Column
      enaNotes:
        description: ENA notes
        title: European Nucleotide Association (ENA) - notes
      enumeration:
        description: The numeric value that corresponds to a given value in a set,
          defined in the sets table.
        title: Enumeration for set values
      measureRepID:
        description: Unique identifier for a measurement.
        title: Measure Report ID
      fileLocation:
        description: The location of the file containing the geometry of the polygon.
        title: File location of polygon
      firstName:
        description: Specifies the first name of a given contact.
        title: First name of contact
      fraction:
        description: Fraction of the sample that is analyzed.
        title: Fraction analyzed
      reportTableName:
        description: The report table that the wide name calls from.
        title: Report table name (wide table)
      reportTableInput:
        description: The short name for the listed source table.
        title: Report table input (wide table)
      license:
        description: The license of a dataset.
        title: License
      partTypeName:
        description: The part type being used in a wide name.
        title: Part type name (wide table)
      measureSetRepID:
        description: Unique identifier that links together a group of related measures.
        title: Measure set report set ID
      siteType:
        description: Type of site or institution where sample was taken.
        title: Site Type
      sampleShed:
        description: A geographic area, physical space, or structure. A sample is
          taken from a sampleshed for a representative measurement of a substance(s).
        title: Sample shed
      geoType:
        description: Type of geography that is represented by the polygon.
        title: Type of geography
      geoWKT:
        description: Well-known text of the polygon
        title: Well-known text
      partTypeInput:
        description: The partID for the part type being used in a wide name.
        title: Part type input (wide table)
      measure:
        description: A measurement or observation of any substance including a biological,
          physical or chemical substance.
        title: Measure
      insType:
        description: Type of instrument used to perform the measurement.
        title: Instrument Type
      insTypeOth:
        description: Description of the instrument in case it is not listed in instrumentType.
        title: Describe other instrument type, if applicable
      iso6391:
        description: The first part of the ISO 639 series of international standards
          for language codes. Part 1 covers the registration of two-letter codes.
          There are 183 two-letter codes registered as of June 2021. The registered
          codes cover the world's major languages.
        title: ISO639-1
      iso6392T:
        description: A set of international standards that lists short codes for language
          names. These ISO639-2 are the three-letter codes defined in part two (ISO
          639-2) of the standard, including the corresponding two-letter (ISO 639-1)
          codes where they exist. The 'T' specifies the terminological code (T code).
        title: ISO639-2T
      isoCode:
        description: The ISO 3166-1 alpha-2 code, a two-letter country code which
          is also used to create the ISO 3166-2 country subdivision code and the Internet
          country code top-level domain.
        title: ISO 3166-1 alpha-2 country code
      isoCodeX:
        description: The ISO 3166-1 alpha-3 code, a three-letter country code which
          may allow a better visual association between the code and the country names
          than the 3166-1 alpha-2 code.
        title: ISO 3166-1 alpha-3 country code
      isoZone:
        description: The ISO 3166-2 codes for the names of the principal subdivisions
          (e.g., provinces, states, departments, regions) of all countries coded in
          ISO 3166-1.
        title: ISO 3166-2 code for country sub-domain
      organizationID:
        description: A unique identifier for the organization to which the reporter
          is affiliated.
        title: Organization ID
      langFam:
        description: Specifies the language family of a given language for translation
          and language tracking purposes.
        title: Language family
      langName:
        description: Specifies the name of the language in roman alphabet characters
          for translation and language tracking purposes.
        title: Language name
      langScript:
        description: "The language(s) and script(s) used for the country\u2019s capital\
          \ endonyms."
        title: National language script
      parDatasetID:
        description: The datasetID that is a parent to another datasetID.
        title: Parent dataset ID
      lastName:
        description: Specifies the last name of a given contact.
        title: Last name of contact
      manufacturer:
        description: Manufacturer of an instrument.
        title: Manufacturer
      parSiteID:
        description: The siteID that is a parent to another siteID; usually the sub-site
          will be contained in the parentSite.
        title: Parent Site ID
      compartmentName:
        description: The compartment referenced for the wide name.
        title: Compartment name (wide table)
      measureLic:
        description: Specifies the access and use licensing for a given single measurement.
        title: Measure license
      compartmentInput:
        description: The partID for the compartment being used in a wide name.
        title: Compartment input (wide table)
      stateProvReg:
        description: The state, province, or region where a site or organization is
          located; part of the address.
        title: State, Province, or Region
      summ:
        description: Short description of the assay and how it is different from the
          other assay methods.
        title: Summary
      specimenName:
        description: The specimen referenced for the wide name.
        title: Specimen name (wide table)
      specimenInput:
        description: The partID for the specimen being used in a wide name.
        title: Specimen input (wide table)
      model:
        description: Model number or version of the instrument.
        title: Model
      nameEngl:
        description: English-language name of a given country.
        title: English name for countries
      nameOfficial:
        description: Official english-language name of a given state.
        title: Official state name
      natName:
        description: The native name of the language, i.e. what the language is called
          by its speakers.
        title: Native Name
      ncbi:
        description: NCBI header
        title: National Center for Biotechnology Information
      ncbiNotes:
        description: NCBI notes
        title: NCBI - notes
      norman:
        description: NORMAN header
        title: NORMAN
      normanNotes:
        description: Norman notes
        title: NORMAN - notes
      stepVer:
        description: Specifies the version of a given protocol step.
        title: Protocol step version
      numCode:
        description: The ISO 3166-1 numeric code, a three-digit country code which
          is identical to that developed and maintained by the United Nations Statistics
          Division, with the advantage of script (writing system) independence, and
          hence useful for people or systems using non-Latin scripts.
        title: ISO 3166-1 numeric country code
      nwss:
        description: NWSS header
        title: National Wastewater Surveillance System
      nwssNotes:
        description: NWSS notes
        title: NWSS - notes
      nwssProcess:
        description: NWSS process
        title: NWSS - process
      orgLevel:
        description: The geographic level of an organization.
        title: Organization level
      orgSector:
        description: The sector of an organization
        title: Organization sector
      orgType:
        description: Specifies the type or purpose of a given organization.
        title: Organization Type
      origin:
        description: An attribute of a sample specifying the origin.
        title: Sample origin
      polygonID:
        description: Unique identifier for the polygon.
        title: Polygon ID
      email:
        description: Contact e-mail address, for the lab.
        title: Contact email
      repOrg1:
        description: The primary or most responsible authority for rountine surveillance
          reports or findings, or where the site is located.
        title: Primary reporting authority ID
      fractionName:
        description: The fraction analyzed referenced for the wide name.
        title: Fraction name (wide table)
      fractionInput:
        description: The partID for the fraction being used in a wide name.
        title: Fraction input (wide table)
      pCode:
        description: The zip code or postal code for a given address, specifying a
          specifc geographic area.
        title: Postal or Zip Code
      phage:
        description: PHAGE header
        title: PHAGE
      phageNotes:
        description: PHAGE notes
        title: PHAGE - notes
      phone:
        description: International dialing code for the country.
        title: Country national phone prefix
      poLic:
        description: The license for the availability of the polygon shapefile.
        title: Polygon License
      originalFormat:
        description: The original structure or model used to record and store the
