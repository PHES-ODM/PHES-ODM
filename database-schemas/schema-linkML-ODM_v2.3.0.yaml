      aggregations:
        description: Statistical measures used to report a measure. Each measure reported
          as a number should be reported with an aggregation. The default aggregation
          is `sin`, which corresponds to a single measurement.
        title: Aggregations
      aggregationScales:
        description: The scale of an aggregation set. Aggregation scales include quantitative
          and qualitative.
        title: Aggregation scales
      attributes:
        description: Attributes describe the who, where, when, and why of environmental
          surveillance. There are attributes for domain, specimen, compartment, or
          table. Attributes are one of the three main components or ways to report
          environment surviellence data. The other two components are measures and
          methods.
        title: Attributes
      aggregationSets:
        description: Sets of aggregations. Examples of aggregation sets include logarithm,
          linear and boolean.
        title: Aggregation sets
      categories:
        description: 'A discrete list of values that can be reported for a measure,
          method or attribute. A use-case example of categories would be how they
          are used to record the site where a measure is taken (partID = geoType).
          For the geoType attribute there are different type of sites where samples
          can be taken: a wastwater treatment plant, airplane holding tank, wastwater
          pumping station, etc. Each of these site types is recorded as a category
          that can be identified in categorySetID = sTypeCatSets'
        title: Categories
      classes:
        description: A class is a collection of one or more related measures or methods
          within a group. A group can have one more more classes to describe different
          parts or the class.
        title: Classes
      compartments:
        description: The substance from which a sample was taken. For example, wastewater
          has component of "water". Compartments are attributes of measures, methods,
          units, and aggregations.
        title: Compartments
      compartmentSets:
        description: Sets of compartments. Compartment sets are used to identify when
          a measure can be recorded for more than one compartment. For example, SARS-CoV-2
          can be measured in people (humans), water, surface, or air.
        title: Compartment sets
      dataTypes:
        description: 'The data type for a part. Data types used in the ODM include:
          varchar, booleen, float, category, date, time, datetime, url, email. dataType
          corresponds the the entry or cell within a data table, most commonly within
          a report table. If the data entry has a unit, then the dataType corresponds
          to the unit and the dataType refers to ''unit''. If the data entry is a
          category, then the dataType refers to ''category''. All categories are varchar.
          Otherwise the dataType is identifed within the part entry. TBA: dataType
          for dictionary.'
        title: Data types part type
      dictionarySupport:
        description: 'Additional sheets for the Excel version of the ODM dictionary.
          Sheets or tabs for the ODM Excel dictionary include: all ERD tables (look-up
          tables and data entry tables) and additional supportig tables.'
        title: Additional dictionary sheets
      dictSets:
        description: Sets used to describe and group dictionary tables.
        title: Dictionary set type
      domains:
        description: 'There are three domain types: biologic (i.e. Covid-19, chemical
          (i.e. nitrogen), physical measure (temperature).'
        title: Domains
      exceptions:
        description: An exception part type for use in creating wide names that do
          not follow the general structure.
        title: Exceptions Part Type
      groups:
        description: A collection of related measures. Used primary to group measurements
          and methods, this helps pare down the drop down list for a given measurement
          or methods.
        title: Groups
      measurements:
        description: The attribute to describe a part type of measures. All measures
          have `partType` = "measure".
        title: Measures
      methods:
        description: Procedures or steps for collecting samples or performing measures.
          For example, `methodExtract` is a method that describes the how a sample
          was extracted.
        title: Methods
      missingness:
        description: The part type for missingness values. Only used for the dictionary
          entries of parts.
        title: Missingness
      missingnessSets:
        description: Set of missingness values. Examples of missingness sets may include
          NR or NA esclusive sets, or general all-purpose sets.
        title: Missingness sets
      mmaSets:
        description: A set of categories. For example, site type has a list of different
          sites, such as a wastewater treatment plant, a septic tank, or a pumping
          station. Only used for the dictionary entries of parts.
        title: Measure, method, or attribute sets
      nomenclatures:
        description: A classification system to report the measure class. See partID
          = nomenclatureID.
        title: Nomenclatures
      partSupport:
        description: Parts designed to support the metadata definition of other parts
          in the parts table.
        title: Part Support
      qualityIndicators:
        description: A measure of the quality of a reported value or sample. Only
          used for the dictionary entries of parts.
        title: Quality indicators
      qualityIndSets:
        description: Sets of quality indicators or measures. For example, PCR have
          a quality measure set.
        title: Quality indicator sets
      shortSets:
        description: Sets used to group together short names for tables or part types
          in ODM.
        title: Shorthand or Short Name Set Type
      specimens:
        description: 'Measures or observations are taken from three types of substances:
          populations (humans or geographic areas), samples, sites. See partID = specimentID.'
        title: Specimens
      specimenSets:
        description: Sets of specimens.  Specimen sets are used when a measure or
          attribute can be recorded for more than one specimen.
        title: Specimen sets
      tables:
        description: Tables are where measures, methods and attributes are recorded.
          Tables represent the main entities of the environmental surveillance. An
          example of a  table is `site` a collection of attributes such as site name
          and address to describe where environment samples are taken. PHES-ODM has
          report tables, but users can create their own tables as well.
        title: Tables
      tableSupport:
        description: Parts designed to support the metadata definition oftables in
          the parts table.
        title: Table Support
      units:
        description: The unit of the measurement. Every measurement must have a unit.
          Meaning, `units` are a mandatory field whenever a measurement is recorded.
        title: Units
      unitSets:
        description: Sets of units. Contains units that are associated with part types
          such as measures. Sets are lists of input values. Each input value within
          a set is a part (has a partID) that can be reused between sets. For example,
          a set A could contain the values of 'yes' and 'no'; and set B could contain
          the values of 'yes', 'no', and 'maybe.' partTypes with sets include aggregations,
          compartments, missingness, quality flags, specimens, and units. Measures
          with categories and dataTypes have their own specific sets (catSetID) because
          their input values are unique and are not reused.
        title: Unit sets
  qualityIndSets:
    description: Sets of quality indicators or measures. For example, PCR have a quality
      measure set.
    title: Quality indicator sets
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      genQualitySet:
        description: A quality set to specify any generic quality concerns about a
          measure or sample.
        title: Generic quality flag set
      measQualitySet:
        description: A quality set for any measure, includes all the quality flag
          options for any measure.
        title: Measures quality set
      pcrQualitySet:
        description: Quality set for PCR measures.
        title: PCR quality set
      sampleQualitySet:
        description: Quality set for a sample.
        title: Sample quality set
      seqQualitySet:
        description: Quality set for sequencing measures
        title: Sequencing quality set
  qualityIndicators:
    description: A measure of the quality of a reported value or sample. Only used
      for the dictionary entries of parts.
    title: Quality indicators
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      beLOD:
        description: Measure is below the limit of detection (LOD) for a specific
          analyte.
        title: Below LOD
      expFail:
        description: PCR experiment failed. No value reported.
        title: Experiment Failed
      flagAI:
        description: The original sample was inhibited; however, the inhibition has
          been addressed through dilution. The reported concentration estimate is
          the updated result after addressing inhibition.
        title: AI - Inhibition present but addressed
      flagB:
        description: "Analytical result may be subject to \u201Ctrace\u201D levels\
          \ of contamination; the target analyte was also detected in negative controls\
          \ on the same run as the sample."
        title: B - Trace levels of contamination
      flagFI:
        description: The original sample was inhibited; however, the inhibition has
          not been successfully addressed. Therefore, no concentration estimate has
          been reported.
        title: FI - Inhibition present and unaddressed
      flagJ:
        description: Analytical result falls below the lowest concentration of the
          experiment-specific standard curve but above the y-intercept value; the
          reported value is based on the extrapolation of the standard curve in the
          non-linear region.
        title: J - Weak signal extrapolation
      flagND:
        description: No amplification occurred in the reaction; non-detect.
        title: ND - Non-detect
      flagUJ:
        description: "Observed quantitation cycle is greater than the experiment-specific\
          \ standard curve intercept value but evidence of clear amplification was\
          \ present (i.e., \u201Ctrace\u201D signal observed); the reported value\
          \ is based on the extrapolation of the standard curve in the non-linear\
          \ region."
        title: UJ - Trace signal extrapolation
      flagUQ:
        description: Unquantifiable, Ct value exceeds the maximum value of the standard
          curve. There was a detect, but we cannot quantify it with certainty.
        title: UQ - Unquantifiable
      frozen:
        description: Sample was frozen before analysis or processing
        title: Sample frozen
      lBC:
        description: The percentage of the genome covered by reads (the breadth) is
          low.
        title: Low breadth of coverage
      lDC:
        description: Poor coverage, specifically an insufficient number of reads or
          too many sequencing reads that are mapped incorrectly.
        title: Low depth of coverage
      leaked:
        description: Sample leaked, some volume and material was lost.
        title: Leaked sample
      lowVol:
        description: Sample is low-volume, but was run regardless.
        title: Low-volume sample
      mI:
        description: Multiple issues have arisen in the sequencing process.
        title: Multiple issues
      noConcern:
        description: A flag to indicate there is are no quality concern about the
          measure or sample.
        title: No quality concerns
      noLabel:
        description: Sample had no label
        title: Sample not labelled
      noTime:
        description: Sample is missing the autosampler time; incomplete metadata on
          collection.
        title: Sample missing time stamp
      ntcAmp:
        description: Quality flag for when the non-template control (NTC) still sees
          amplification - ie. The NTCs in qPCR show a Ct value less than 40, or NTCs
          in a ddPCR have 3 or more positive droplets.
        title: NTC Amplification Detected
      oor:
        description: Value is outside of the allowable range for quality control.
        title: Value out of range
      out:
        description: Value is an outlier and may be of questionable quality.
        title: Value is an outlier
      qf1:
        description: A flag to indicate there is a quality concern, not otherwise
          sepcified.
        title: Quality concerns
      sC:
        description: Sequencing shows sparse coverage, ie. numerical breadth of coverage
          shows as adequate but coverage plots reveal missing genome pieces.
        title: Sparse coverage
      spill:
        description: Sample contents spilled from container.
        title: Sample spilled
      wI:
        description: The 95% interval is too wide, low confidence in results.
        title: Wide 95% interval
      wrongStorage:
        description: Sample was stored inappropriately.
        title: Sample stored incorrectly
      wrongTemp:
        description: Sample was stored at an inappropriate temperature.
        title: Sample stored at wrong temperature
      lowQualSeq:
        description: Low-quality sequence.
        title: Low-quality Sequence
      seqContam:
        description: Sequence is contaminated.
        title: Sequence Contaminated
      lAGC:
        description: Average coverage of the genome is low/poor.
        title: Low Average Genome Coverage
      lPGC:
        description: Only captured a small/low percentage of the genome.
        title: Low Percent of Genome Captured
      shortRead:
        description: Read lengths are shorter than expected.
        title: Read Lengths Shorter Than Expected
      ampliArtifact:
        description: Sequence amplification artifacts detected.
        title: Sequence Amplification Artifacts
      lowSNRatio:
        description: Low signal-to-noise ratio.
        title: Low Signal-to-Noise Ratio
      lowCovMut:
        description: Low coverage of characteristic mutations.
        title: Low Coverage of Characteristic Mutations
      belowLOQ:
        description: Indicates that a measurement detected the analyte, but at levels
          below the limit of quantification (LOQ).
        title: Measured levels below LOQ
      delayArriv:
        description: A substantial delay (ie. of more than 14 days) between sample
          collection and the start of analysis.
        title: Delayed Arrival or Prolonged Transit
