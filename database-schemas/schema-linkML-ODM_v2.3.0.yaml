  protocolRelationships:
    description: The table that contains the organizational information and details
      (such as order) about a given protocol, recorded as a series of protocol steps
      (protocolSteps). Protocols are a group of related protocol steps. For example
      a protocol step can describe a sample concentration, extraction, inhibition
      or a measurement. Protocols can include both methodID (a proceedure) and measureIDs
      (a measure). An example of a method is centrifugation; where the centriguation
      rotation speed is described as a measure. The short name for the table (partID)
      can be found in the instructions field.
    title: Protocol relationships table
    from_schema: https://onto.phes-odm.org/odm/v2
    slots:
    - protocolRelationshipsID
    - protocolIDContainer
    - protocolIDObj
    - stepIDObj
    - relationshipID
    - protocolIDSub
    - stepIDSub
    - lastEdited
    - notes
    slot_usage:
      protocolRelationshipsID:
        description: A unique, autoincremental ID generated to produce a unique identifier
          and primary key for each row of the protocolRelationships table.
        title: Synthetic ID for the protocolRelationships table
        identifier: true
        range: string
        required: true
        pattern: ^.{0,50}$
      protocolIDContainer:
        description: Unique identifier for the protocol and the steps and other protocols
          that make it up.
        title: Protocol ID container
        notes:
        - Protocol ID Container in popuated by a protocolID (partID = protocolID)
        required: true
        pattern: ^.{0,30}$
        any_of:
        - range: protocols
        - range: genMissingnessSet
      protocolIDObj:
        description: The object of the relationship between one protocol and another
          protocol or step, within a given protocol ID container.
        title: Protocol ID object
        notes:
        - 'Populate this field using Protocol ID (partID = protocolID). Together with
          `protocolIDSub` or `stepIDSub` and `relationshipID`, the protocol relationship
          is defined as: [protocolIDSubject or stepIDSubject]  [relationshipID] [protocolIDObject
          or stepIDObject]. Ex: stepIDSubject  precedes protocolIDObject.'
        pattern: ^.{0,30}$
        any_of:
        - range: protocols
        - range: genMissingnessSet
      stepIDObj:
        description: The object of the relationship between one protocol step and
          another step or protocol, within a given protocol ID container.
        title: Step ID Object
        notes:
        - 'Populate this field using Protocol Step ID (partID = stepID). Together
