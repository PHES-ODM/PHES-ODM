  samples:
    description: The table that contains information about a sample. A sample is defined
      as a representative volume of wastewater (or other forms of water or liquid),
      air, or surface area taken from a site.Samples can be combined, split, stored
      and reused. The `Sample relationships` (sampleRelationships) is used to describe
      the relationships between samples. The short name for the table (partID) can
      be found in the instructions field.
