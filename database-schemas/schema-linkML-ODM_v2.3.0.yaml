      such as measures. Sets are lists of input values. Each input value within a
      set is a part (has a partID) that can be reused between sets. For example, a
      set A could contain the values of 'yes' and 'no'; and set B could contain the
      values of 'yes', 'no', and 'maybe.' partTypes with sets include aggregations,
      compartments, missingness, quality flags, specimens, and units. Measures with
      categories and dataTypes have their own specific sets (catSetID) because their
      input values are unique and are not reused.
