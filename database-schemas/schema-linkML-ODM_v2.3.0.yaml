  listSet:
    description: PartTypes that contain categories, sets, or lists.
    title: List set
    from_schema: https://onto.phes-odm.org/odm/v2
    permissible_values:
      dataTypes:
        description: 'The data type for a part. Data types used in the ODM include:
          varchar, booleen, float, category, date, time, datetime, url, email. dataType
          corresponds the the entry or cell within a data table, most commonly within
          a report table. If the data entry has a unit, then the dataType corresponds
          to the unit and the dataType refers to ''unit''. If the data entry is a
          category, then the dataType refers to ''category''. All categories are varchar.
          Otherwise the dataType is identifed within the part entry. TBA: dataType
          for dictionary.'
        title: Data types part type
      aggregationScales:
        description: The scale of an aggregation set. Aggregation scales include quantitative
          and qualitative.
        title: Aggregation scales
      aggregations:
        description: Statistical measures used to report a measure. Each measure reported
          as a number should be reported with an aggregation. The default aggregation
          is `sin`, which corresponds to a single measurement.
        title: Aggregations
      attributes:
        description: Attributes describe the who, where, when, and why of environmental
          surveillance. There are attributes for domain, specimen, compartment, or
          table. Attributes are one of the three main components or ways to report
          environment surviellence data. The other two components are measures and
          methods.
        title: Attributes
      classes:
        description: A class is a collection of one or more related measures or methods
          within a group. A group can have one more more classes to describe different
          parts or the class.
        title: Classes
      compartments:
        description: The substance from which a sample was taken. For example, wastewater
          has component of "water". Compartments are attributes of measures, methods,
          units, and aggregations.
        title: Compartments
      domains:
        description: 'There are three domain types: biologic (i.e. Covid-19, chemical
          (i.e. nitrogen), physical measure (temperature).'
        title: Domains
      groups:
        description: A collection of related measures. Used primary to group measurements
          and methods, this helps pare down the drop down list for a given measurement
          or methods.
        title: Groups
      measurements:
        description: The attribute to describe a part type of measures. All measures
          have `partType` = "measure".
        title: Measures
      methods:
        description: Procedures or steps for collecting samples or performing measures.
          For example, `methodExtract` is a method that describes the how a sample
          was extracted.
        title: Methods
      missingness:
        description: The part type for missingness values. Only used for the dictionary
          entries of parts.
        title: Missingness
      nomenclatures:
        description: A classification system to report the measure class. See partID
          = nomenclatureID.
        title: Nomenclatures
      qualityIndicators:
        description: A measure of the quality of a reported value or sample. Only
          used for the dictionary entries of parts.
        title: Quality indicators
      specimens:
        description: 'Measures or observations are taken from three types of substances:
          populations (humans or geographic areas), samples, sites. See partID = specimentID.'
        title: Specimens
      tables:
        description: Tables are where measures, methods and attributes are recorded.
          Tables represent the main entities of the environmental surveillance. An
          example of a  table is `site` a collection of attributes such as site name
          and address to describe where environment samples are taken. PHES-ODM has
          report tables, but users can create their own tables as well.
        title: Tables
      units:
        description: The unit of the measurement. Every measurement must have a unit.
          Meaning, `units` are a mandatory field whenever a measurement is recorded.
        title: Units
