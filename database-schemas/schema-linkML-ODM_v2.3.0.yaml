        title: Synthetic ID for the translations table
      lastEdited:
        description: The date the entry was last updated.
        title: Last edited
      unitInput:
        description: The partID for the unit being used in a wide name.
        title: Unit input (wide table)
      aggregationName:
        description: The aggregation referenced for the wide name.
        title: Aggregation name (wide table)
      utc:
        description: "UTC \u2013 Time zone."
        title: Coordinated universal time (UTC) zone
      utcDST:
        description: Time zone during Daylight Saving Time.
        title: Coordinated universal time (UTC) zone in daylight savings
      notes:
        description: A note used to describe details that are not captured in other
