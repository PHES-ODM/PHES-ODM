        title: Sovereign status of a country
      specimen:
        description: The substance or thing upon which the observation was made.
        title: Specimen
      methodInput:
        description: The partID for the method being used in a wide name.
        title: Method input (wide table)
      unitName:
        description: The unit referenced for the wide name.
        title: Unit name (wide table)
      country:
        description: The country where a site or organization is located; part of
          the address.
        title: Country
      stepIDObj:
        description: The object of the relationship between one protocol step and
          another step or protocol, within a given protocol ID container.
        title: Step ID Object
      stepIDSub:
        description: The subject of the relationship between one protocol step and
