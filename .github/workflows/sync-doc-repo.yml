name: Sync Excel dictionary to PHES-ODM-Doc

# Pushes the current templates/ODM_templates_V<version>.xlsx into
# PHES-ODM/PHES-ODM-Doc's data/raw/ (as ODM_dictionary_<version>.xlsx --
# the exact name PHES-ODM-Doc/R/get-latest-dictionary.R looks for), bumps
# that repo's own documentation version, renders the Quarto book using that
# repo's own build action, and opens a PR there with the result. This is
# the automated version of the sync-odm-doc-release skill's mechanical half
# (see PHES-ODM-ops's .claude/skills/sync-odm-doc-release/SKILL.md for the
# full manual process this mirrors, and for review-odm-doc-content, the
# hand-written-prose half this does NOT attempt).
#
# It ALSO copies the freshly-rendered PDF straight into THIS repo's
# doc-source/ and opens a second, companion PR here -- in the same job, not
# as a separate reciprocal workflow. That's deliberate, not simplification
# for its own sake: PHES-ODM-Doc's docs/ (Quarto's output-dir) is gitignored
# there and published straight to its gh-pages branch by publish-docs.yml,
# never committed to main -- confirmed empirically (2026-09) after a
# same-repo predecessor design assumed docs/ landed on main and built a
# separate push-triggered workflow around that assumption, which then could
# never fire. Since this job already has the rendered PDF sitting in its
# own workspace (doc-repo/docs/...), and already has PHES-ODM checked out,
# copying it over directly is simpler and doesn't depend on a merge that
# was never going to trigger anything.
#
# Needs a CROSS_REPO_TOKEN secret in THIS repo: a fine-grained PAT with
# Contents + Pull requests write access to PHES-ODM/PHES-ODM-Doc, used only
# for the PHES-ODM-Doc checkout/PR. The PR back into PHES-ODM itself uses
# the workflow's own default token instead (same repo) -- which requires
# "Allow GitHub Actions to create and approve pull requests" to be enabled
# under this repo's Settings > Actions > General (confirmed needed
# 2026-09, same setting regenerate-odm-template.yml's PR step needs).
#
# The documentation's own version (DESCRIPTION's Version:, and
# _quarto.yml's version:/output-file:) is set to match the dictionary
# version by .github/scripts/bump_doc_version.py -- it used to be tracked
# independently (and had already drifted: DESCRIPTION at 2.1.0 while
# _quarto.yml was still at 2.0.1, observed 2026-09), but an independent doc
# version sitting next to a dictionary at v3.0.1 was confusing rather than
# useful, since every other artifact (workbook, SQL seed data, changelog)
# is already named for the dictionary version. As of 2026-09 the two are
# the same number on every sync -- no more separate bump to reason about.
#
# Rendering the Quarto book can genuinely fail here -- a new partType or
# required column the display templates don't handle yet needs a human to
# patch R code, not something this workflow should ever attempt on its own
# (see sync-odm-doc-release's anti-patterns). So the PHES-ODM-Doc PR is
# opened regardless of the render outcome, with the render log (or
# failure) in the PR body -- never silently, and never blocking the file
# swap from at least landing for review. The companion PHES-ODM PR (the
# PDF) only happens when the render actually succeeded and produced one --
# there's nothing meaningful to copy otherwise.

on:
  push:
    branches: [main]
    paths:
      - "templates/ODM_templates_V*.xlsx"
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-render and re-sync even though the xlsx dictionary snapshot in PHES-ODM-Doc already matches this version. Use this after fixing something in PHES-ODM-Doc''s own rendering code (an R/qmd bug, say) that a same-version xlsx would otherwise mask -- the "needed" check below only compares the xlsx filename, so it has no way to know the render output itself is stale for a reason that has nothing to do with the dictionary version.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PHES-ODM
        uses: actions/checkout@v4

      - name: Determine current dictionary version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import csv; print(next(csv.reader(open('dictionary-tables/ODM_parts.csv')))[1])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout PHES-ODM-Doc
        uses: actions/checkout@v4
        with:
          repository: PHES-ODM/PHES-ODM-Doc
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: doc-repo

      - name: Check whether a sync is needed
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE}" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "force=true: re-syncing and re-rendering regardless of whether the xlsx snapshot already matches."
            exit 0
          fi
          CURRENT=$(ls doc-repo/data/raw/ODM_dictionary_*.xlsx 2>/dev/null | head -1 || true)
          TARGET="doc-repo/data/raw/ODM_dictionary_${{ steps.version.outputs.version }}.xlsx"
          if [ "$CURRENT" = "$TARGET" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "PHES-ODM-Doc already has ODM_dictionary_${{ steps.version.outputs.version }}.xlsx -- nothing to sync. If you need to re-render anyway (e.g. after fixing something in PHES-ODM-Doc's own rendering code), re-run this workflow with 'force' checked."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Swap in the new dictionary snapshot
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          rm -f doc-repo/data/raw/ODM_dictionary_*.xlsx
          cp "templates/ODM_templates_V${{ steps.version.outputs.version }}.xlsx" \
             "doc-repo/data/raw/ODM_dictionary_${{ steps.version.outputs.version }}.xlsx"

      - name: Bump the documentation version
        if: steps.check.outputs.needed == 'true'
        id: docver
        run: python3 .github/scripts/bump_doc_version.py doc-repo "${{ steps.version.outputs.version }}"

      - name: Install quarto
        if: steps.check.outputs.needed == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install tinytex
        if: steps.check.outputs.needed == 'true'
        run: quarto install tool tinytex

      - name: Set up R
        if: steps.check.outputs.needed == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.0.3"

      - name: Install R dependencies
        if: steps.check.outputs.needed == 'true'
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: doc-repo

      - name: Render quarto
        if: steps.check.outputs.needed == 'true'
        id: render
        working-directory: doc-repo
        # Never fails the job -- a render failure still needs the file swap
        # and version bump to reach review, with the failure itself as the
        # most important thing in the PR body. continue-on-error lets later
        # steps run normally instead of needing if: always() everywhere.
        continue-on-error: true
        run: |
          set -o pipefail
          quarto render ./qmd 2>&1 | tee /tmp/quarto-render.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize render outcome
        if: steps.check.outputs.needed == 'true'
        id: summary
        run: |
          {
            echo "body<<RENDER_EOF"
            if [ "${{ steps.render.outcome }}" = "success" ]; then
              echo "Quarto render: **succeeded**."
            else
              echo "Quarto render: **FAILED** -- this PR still swaps in the new dictionary snapshot and bumps the version, but the rendered docs/ output may be stale or missing. A human needs to look at the log below before merging."
            fi
            echo ""
            echo '```'
            tail -c 4000 /tmp/quarto-render.log 2>/dev/null || echo "(no render log captured)"
            echo '```'
            echo "RENDER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR in PHES-ODM-Doc
        if: steps.check.outputs.needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: doc-repo
          commit-message: "Sync dictionary snapshot to v${{ steps.version.outputs.version }}, bump docs to v${{ steps.docver.outputs.new_version }}"
          title: "Sync dictionary snapshot to v${{ steps.version.outputs.version }}"
          body: |
            Auto-generated by PHES-ODM/PHES-ODM's `sync-doc-repo.yml` after
            `templates/ODM_templates_V${{ steps.version.outputs.version }}.xlsx`
            changed on `main` there.

            - Swapped in `data/raw/ODM_dictionary_${{ steps.version.outputs.version }}.xlsx`, removing the old versioned snapshot.
            - Set the documentation version from `${{ steps.docver.outputs.old_version }}` to `${{ steps.docver.outputs.new_version }}` in `DESCRIPTION` and `qmd/_quarto.yml`, matching the dictionary version this snapshot is from.

            ${{ steps.summary.outputs.body }}

            `docs/` (the rendered site) isn't part of this PR -- it's gitignored in this repo and published to `gh-pages` separately by `publish-docs.yml`. If the render above succeeded, the rendered PDF has already been opened as its own companion PR against `PHES-ODM/PHES-ODM`'s `doc-source/`, from this same workflow run.

            Consider chaining into `review-odm-doc-content` (PHES-ODM-ops skill) to audit the hand-written chapters against what changed between the two dictionary versions -- this PR only handles the auto-generated reference chapters.
          branch: auto/sync-dictionary-snapshot
          delete-branch: true
          add-paths: |
            data/raw/ODM_dictionary_*.xlsx
            DESCRIPTION
            qmd/_quarto.yml

      - name: Copy rendered PDF into PHES-ODM
        if: steps.check.outputs.needed == 'true' && steps.render.outcome == 'success'
        id: copypdf
        run: |
          set -euo pipefail
          PDF="doc-repo/docs/ODM-documentation-v${{ steps.docver.outputs.new_version }}.pdf"
          if [ ! -f "$PDF" ]; then
            echo "::warning::expected rendered PDF not found at $PDF -- skipping the PHES-ODM companion PR."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f doc-source/ODM-documentation-v*.pdf
          cp "$PDF" "doc-source/ODM-documentation-v${{ steps.docver.outputs.new_version }}.pdf"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Open companion PR in PHES-ODM
        if: steps.check.outputs.needed == 'true' && steps.copypdf.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Sync rendered documentation PDF to v${{ steps.docver.outputs.new_version }}"
          title: "Sync rendered documentation PDF to v${{ steps.docver.outputs.new_version }}"
          body: |
            Auto-generated by this repo's own `sync-doc-repo.yml`, from the
            same run that just synced `templates/ODM_templates_V${{ steps.version.outputs.version }}.xlsx`
            to `PHES-ODM/PHES-ODM-Doc` and rendered its Quarto book there.

            Swapped in `doc-source/ODM-documentation-v${{ steps.docver.outputs.new_version }}.pdf`, removing the old versioned PDF.
          branch: auto/sync-documentation-pdf
          delete-branch: true
          add-paths: doc-source/ODM-documentation-v*.pdf
