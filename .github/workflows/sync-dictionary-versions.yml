name: Sync dictionary table versions

# Keeps each dictionary-tables/ODM_<table>.csv identical to its
# ODM_<table>_v<version>.csv sibling. Both are hand-edited in practice -- a
# fix sometimes lands on one, sometimes the other -- and that's exactly how
# they drifted apart during the 2026-09 SQL/Excel template audit (stale
# TRUE/FALSE partID casing, a blank dataType, and stale wideNames labels all
# diverged independently between the two, in three separate incidents).
#
# Whichever file actually changed in a push propagates to its sibling,
# committed directly to main -- this is a pure mechanical mirror (copy
# content, keep/derive the unversioned file's leading "Version,X.Y.Z" stamp
# row) with no judgment call for a human to review; the review already
# happened on the edit that triggered it. See
# .github/scripts/sync_dictionary_versions.py for the actual sync logic.
#
# If both files changed in the same push and disagree after normalizing for
# that stamp row, nothing is guessed or silently overwritten for that
# table -- it's left untouched, the job fails, and a GitHub issue is opened
# with the details. Any OTHER table in the same push that synced cleanly is
# still committed regardless.
#
# regenerate-odm-template.yml explicitly excludes the *_v*.csv files from
# its own trigger, so editing the versioned sibling alone doesn't kick off
# an Excel/SQL regeneration against stale unversioned content -- that only
# happens once this workflow's sync commit has updated the actual file
# those generators read, which re-triggers that workflow normally.
#
# This workflow's own sync commits re-trigger this same workflow (they
# touch dictionary-tables/ODM_*.csv too), but by then both files already
# match, so the re-run finds nothing to do and exits cleanly -- no loop.

on:
  push:
    branches: [main]
    paths:
      - "dictionary-tables/ODM_*.csv"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine diff range
        id: range
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after || github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Sync versioned/unversioned CSV pairs
        id: sync
        run: python .github/scripts/sync_dictionary_versions.py "${{ steps.range.outputs.before }}" "${{ steps.range.outputs.after }}"
        continue-on-error: true

      - name: Commit and push synced files
        if: steps.sync.outputs.synced != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dictionary-tables/ODM_*.csv
          if git diff --cached --quiet; then
            echo "Nothing staged, skipping commit."
            exit 0
          fi
          git commit -m "Sync dictionary table versions: ${{ steps.sync.outputs.synced }}"
          git push

      - name: Open issue for conflicted tables
        if: steps.sync.outputs.conflicts != ''
        uses: actions/github-script@v7
        with:
          script: |
            const conflicts = "${{ steps.sync.outputs.conflicts }}".split(',').filter(Boolean);
            for (const table of conflicts) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Dictionary table version conflict: ${table}`,
                body: `\`ODM_${table}.csv\` and its versioned sibling were both edited in the same push (${context.sha}) and now disagree after accounting for the unversioned file's Version-stamp row. Neither was auto-synced -- please reconcile them by hand (pick which edit is correct, or merge both), then push again.\n\nSee the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the log.`,
              });
            }

      - name: Fail if any conflicts were found
        if: steps.sync.outputs.conflicts != ''
        run: |
          echo "Conflicted tables (see issue(s) just opened): ${{ steps.sync.outputs.conflicts }}"
          exit 1
